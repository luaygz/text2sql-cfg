  # --- over_long -----------------------------------------------------------------------------
  - {id: ol-limit-too-large, category: over_long, sql: "SELECT name FROM accounts LIMIT 100000"}
  - {id: ol-limit-missing, category: over_long, sql: "SELECT name FROM accounts"}
  - {id: ol-limit-negative, category: over_long, sql: "SELECT name FROM accounts LIMIT -1"}
  - {id: ol-limit-expression, category: over_long, sql: "SELECT name FROM accounts LIMIT 500 + 500000"}
  - {id: ol-limit-subquery, category: over_long, sql: "SELECT name FROM accounts LIMIT (SELECT COUNT(*) FROM activities)"}
  - {id: ol-limit-comma-form, category: over_long, sql: "SELECT name FROM accounts LIMIT 5, 100000"}
  - id: ol-offset-huge
    category: over_long
    sql: "SELECT name FROM accounts LIMIT 5 OFFSET 99999999999999999999"
    layers: [grammar]
  - id: ol-long-literal
    category: over_long
    sql: "SELECT name FROM accounts WHERE name = '{A}' LIMIT 5"
    expand: {A: {text: a, times: 300}}
    layers: [grammar]
  - id: ol-sql-too-long
    category: over_long
    sql: "SELECT name FROM accounts WHERE name = 'x'{PAD} LIMIT 5"
    expand: {PAD: {text: " OR name = 'x'", times: 800}}
    layers: [validator]
    note: The grammar has no length bound (the API's output-token cap is the model-side one); the validator caps SQL at 10,000 characters.
  - id: ol-in-list-huge
    category: over_long
    sql: "SELECT name FROM accounts WHERE account_id IN (0{PAD}) LIMIT 5"
    expand: {PAD: {text: ", 0", times: 4000}}
    layers: [validator]
  - id: ol-deep-nesting
    category: over_long
    sql: "SELECT name FROM accounts WHERE account_id = {OPEN}1{CLOSE} LIMIT 5"
    expand: {OPEN: {text: "(", times: 200}, CLOSE: {text: ")", times: 200}}
    layers: [validator, scoping]
    note: The grammar accepts deep nesting; sqlglot's recursion limit makes the validator and scoping refuse it.
  - id: ol-result-bytes
    category: over_long
    expect: bounded
    layers: [executor]
    sql: "SELECT REPLACE(REPLACE('{A150}', 'a', '{A255}'), 'a', '{B255}') FROM accounts LIMIT 5"
    expand: {A150: {text: a, times: 150}, A255: {text: a, times: 255}, B255: {text: b, times: 255}}
    note: Five rows of 9.75 MB each; every value is under the per-value cap, so only a cap on total result size stops it.
  - id: ol-wide-row
    category: over_long
    expect: bounded
    layers: [executor]
    sql: "WITH cte1 AS (SELECT REPLACE(REPLACE('{A150}', 'a', '{A255}'), 'a', '{B255}') AS c1 FROM accounts LIMIT 1) SELECT T1.c1, T1.c1, T1.c1, T1.c1, T1.c1, T1.c1, T1.c1, T1.c1, T1.c1, T1.c1, T1.c1, T1.c1 FROM cte1 AS T1 LIMIT 1"
    expand: {A150: {text: a, times: 150}, A255: {text: a, times: 255}, B255: {text: b, times: 255}}
    note: One row of twelve 9.75 MB columns, built in full before the result cap can count it; the worker's heap limit is the backstop.

