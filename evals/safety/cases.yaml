    note: As with q-double-quoted-hidden, scoping alone turns the name into a harmless string literal.
  - {id: q-mixed-case-tenant-column, category: quoting, layers: [grammar, validator, scoping], sql: "SELECT name FROM deals WHERE Tenant_ID = 3 LIMIT 5"}
  - id: q-double-quoted-string-fallback
    category: quoting
    sql: "SELECT name FROM accounts WHERE name = \"CANARY-T3-796a9b81fb6c\" LIMIT 5"
    note: SQLite reads a double-quoted name that matches no column as a string literal, so this filters on another tenant's canary.
  - {id: q-escaped-quote-identifier, category: quoting, sql: "SELECT \"password\"\"_hash\" FROM users LIMIT 5"}

