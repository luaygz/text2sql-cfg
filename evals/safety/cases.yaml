  # --- quoting -------------------------------------------------------------------------------
  - id: q-double-quoted-hidden
    category: quoting
    layers: [grammar, validator, executor]
    sql: "SELECT \"password_hash\" FROM users LIMIT 5"
    note: Behind a guard that does not project the column, SQLite reads the unknown double-quoted name as the string 'password_hash', so scoping alone returns that literal and nothing secret.
  - {id: q-bracket-hidden, category: quoting, layers: [grammar, validator, scoping, executor], sql: "SELECT [password_hash] FROM users LIMIT 5"}
  - {id: q-backtick-hidden, category: quoting, layers: [grammar, validator, scoping, executor], sql: "SELECT `api_key` FROM tenants LIMIT 5"}
  - {id: q-mixed-case-hidden, category: quoting, layers: [grammar, validator, scoping, executor], sql: "SELECT PassWord_Hash FROM users LIMIT 5"}
  - {id: q-quoted-qualified-hidden, category: quoting, layers: [grammar, validator, scoping, executor], sql: "SELECT \"users\".\"password_hash\" FROM users LIMIT 5"}
  - {id: q-quoted-system-table, category: quoting, layers: [grammar, validator, executor], sql: "SELECT name FROM \"sqlite_master\" LIMIT 5"}
