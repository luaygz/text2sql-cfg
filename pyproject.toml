[project]
name = "text2sql-cfg"
version = "0.1.0"
description = "Grammar-constrained text-to-SQL on the OpenAI Responses API: safe by construction, evaluated on BIRD Mini-Dev and a multi-tenant SaaS database."
readme = "README.md"
license = "MIT"
authors = [{ name = "Luay Gharzeddine", email = "luaygharzeddine@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "datasketch>=2.0.0",
    "faker>=40.43.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "lark>=1.3.1",
    "llguidance>=1.9.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "sqlglot>=30.23.0",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
text2sql = "text2sql.cli:app"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "text2sql"

[dependency-groups]
dev = [
    "hypothesis>=6.170.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PL", "TRY", "ANN"]
ignore = [
    "PLR0913", # many-argument constructors are explicit config objects here
    "PLR2004", # magic values in tests and thresholds
    "TRY003",  # contextual exception messages
    "PLC0415", # local imports keep optional heavy deps lazy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR", "S"]
"scripts/**" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["text2sql"]

[[tool.mypy.overrides]]
module = ["datasketch.*", "llguidance.*", "faker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: calls the OpenAI API (skipped unless T2SQL_LIVE_TESTS=1)",
    "bird: needs the BIRD databases under data/bird (skipped if absent)",
]
