name: Set up the pinned environment
description: >
  Install the pinned uv, the Python version from .python-version and the locked dependencies
  (dev group included), exactly as `make setup` does locally.
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        # Same uv as local development; uv pins which CPython build `.python-version` resolves to.
        version: "0.10.6"
        enable-cache: true
    - name: Install the locked dependencies
      shell: bash
      run: uv sync --frozen
