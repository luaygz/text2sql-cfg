name: Safety suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OFFLINE: "true"
  T2SQL_PHASE: ci

jobs:
  safety:
    name: adversarial suite against the four layers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Grammar, validator, scoping and executor are all local; the suite generates the seeded
      # SaaS database itself and fails unless no case reaches the database.
      - run: make safety
      - name: Upload per-layer stop counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safety-report
          path: reports/safety/
          if-no-files-found: warn
