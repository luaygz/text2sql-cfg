name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: build and smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: text2sql-cfg:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runs as the unprivileged user
        run: test "$(docker run --rm --entrypoint id text2sql-cfg:ci -u)" = 10001
      - name: CLI starts
        run: docker run --rm text2sql-cfg:ci --help
      # Needs neither data nor an API key, so it exercises the image's interpreter, SQLite and
      # all four safety layers end to end.
      - name: Safety suite inside the image
        run: docker run --rm text2sql-cfg:ci safety
