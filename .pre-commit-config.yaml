# Uses the project's own pinned tools (uv.lock) instead of separately versioned hook repos,
# so pre-commit, CI and local runs can never disagree about ruff or mypy versions.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^(cache/|docs/adr/data/)
      - id: trailing-whitespace
        exclude: ^(cache/|docs/adr/data/)
      - id: check-added-large-files
        args: ["--maxkb=60000"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-dotenv
        name: refuse to commit .env
        entry: .env files must not be committed
        language: fail
        files: (^|/)\.env$
